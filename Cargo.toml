[package]
name = "syndrome"
version = "0.6.1"
edition = "2024"
rust-version = "1.97"
license = "MIT"
description = "Multi-standard Forward Error Correction in Rust: 5G NR TS 38.212 (QC-LDPC LOMS), Wi-Fi 6/7, Bluetooth (LE Coded PHY, BR/EDR), Reed-Solomon, Viterbi and Polar codes, with AVX2/NEON SIMD and lock-free pipelining."
authors = ["Thomas Glezer <thomas.glezer@hotmail.com>"]
readme = "README.md"
repository = "https://github.com/ThomasGl/syndrome"
keywords = ["fec", "ldpc", "5g", "reed-solomon", "simd"]
# "no-std" deliberately NOT claimed as a *category*, even though the `no_std`
# feature below now gives a real #![no_std]+alloc build: crates.io categories
# apply unconditionally to the whole crate regardless of which feature a
# given consumer enables, and the default build (no_std feature off) still
# requires std. Revisit if the crate ever makes no_std the unconditional
# default rather than an opt-in feature.
categories = ["algorithms", "encoding"]

# The published tarball is the library, its examples, and its tests. The
# development apparatus stays in the git repository.
#
# `src/bin/` matters most here: those six benchmark exporters are auto-discovered
# as binary targets, so publishing them would make `cargo install syndrome` drop
# `rs_bench`, `ber_sim`, `bench_export`, ... into the user's ~/.cargo/bin under
# names generic enough to collide with other crates. Only the `syndrome` demo
# binary (src/main.rs) should be installable. `bench/` goes with them because
# `bench/run_all.sh` drives those exporters — shipping one without the other
# would leave a harness that cannot run. `embedded-demo/` and `capi/` are
# each their own `publish = false` package (own Cargo.toml/Cargo.lock,
# deliberately not workspace members -- see their READMEs / capi/src/lib.rs's
# module doc) with dependencies (cortex-m-rt, embedded-alloc, ... for the
# former) or a `[lib] crate-type` (for the latter) that make no sense pulled
# into this library's own graph; publishing either alongside `syndrome`
# would also make `cargo install syndrome` try to install their binaries.
exclude = [
    "src/bin/",
    "bench/",
    "tools/",
    ".github/",
    "proptest-regressions/",
    "CLAUDE.md",
    "embedded-demo/",
    "capi/",
]

# rustdoc renders `$...$` in doc comments as literal text — it has no math
# support of its own. `katex-header.html` loads KaTeX so the LaTeX that CLAUDE.md
# mandates throughout the API docs actually typesets on docs.rs.
#
# Preview locally exactly as docs.rs will build it:
#   RUSTDOCFLAGS="--html-in-header katex-header.html" cargo doc --no-deps --all-features
#   python3 -m http.server 8000 --directory target/doc
#   # then open http://localhost:8000/syndrome/index.html
#
# The header pins KaTeX with subresource-integrity hashes. On a version bump,
# recompute them rather than dropping the attribute:
#   curl -sL https://cdn.jsdelivr.net/npm/katex@<ver>/dist/katex.min.js \
#     | openssl dgst -sha384 -binary | openssl base64 -A
[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]
all-features = true

[dependencies]
core_affinity = { version = "0.6", optional = true }
# Optional: only `src/bin/{ber_sim,ldpc_pipeline_bench,ldpc_convergence_export}.rs`
# use it, and those exporters are excluded from the published tarball (see
# `exclude` above). Gated behind the `bench-export` feature below rather than
# a plain [dependencies] entry so downstream consumers of the *library* never
# resolve or build it -- `cargo build --bins` (dev-dependencies are not
# visible to [[bin]] targets) needs `--features bench-export` to build those
# three exporters, e.g. `cargo run --bin ber_sim --features bench-export`.
# It also needs std, so a mandatory entry here would additionally have
# blocked the `no_std` feature below.
serde_json = { version = "1.0", features = ["preserve_order"], optional = true }
# Pure-Rust libm, used only behind the `no_std` feature: core has no
# `sqrt`/`round`/`powf`/`exp`/`ln_1p` etc. (they need a math library, which
# `std` gets from the platform's libm and `core` deliberately does not
# assume). See src/float_ext.rs.
libm = { version = "0.2", optional = true }

[build-dependencies]
serde_json = "1.0"

[features]
# Enable thread-affinity helpers (`#[cfg(feature = "affinity")]` in
# src/affinity.rs); exists because it pulls an optional dependency.
#
# There are deliberately NO `simd`/`simd_avx2`/`simd_neon` features. SIMD is not
# opt-in: the AVX2 kernels dispatch at runtime via `is_x86_feature_detected!` and
# the NEON kernels are gated on `#[cfg(target_arch = "aarch64")]`, so both are
# always available wherever the hardware supports them. Earlier versions declared
# those flags plus `simd_avx512` and `cortex-m`; none of them gated a single line
# of code, so enabling them did nothing while implying a choice that did not exist.
# Removing a feature is a breaking change once published, so they are gone before
# 0.1.0 rather than after. If a genuine compile-time SIMD or `#![no_std]` switch is
# added later, introducing a feature for it is backward-compatible.
affinity = ["core_affinity"]

# #![no_std] + alloc build of the core FEC algorithms (LDPC, Viterbi, Turbo,
# Polar, Reed-Solomon, BCH, Golay, Hamming, CRC, Wi-Fi/Bluetooth profiles,
# the transport-block chain's sequential path, and the lock-free SPSC ring).
# Off by default -- the default build is unchanged std -- so this can only
# ever add capability, never take any away from an existing consumer.
#
# NOT covered, deliberately excluded from the no_std build rather than
# half-ported: `affinity` (an OS thread-affinity API), the C ABI (now its
# own package, `capi/` -- see that package's `src/lib.rs` module doc for why
# it can never be a feature of this crate itself: declaring `[lib]
# crate-type = ["staticlib", "cdylib"]` here would require a global
# allocator + panic handler for every build of the lib target, which a
# `#![no_std]` library crate cannot supply for its eventual consumer),
# `channel_sim`/`montecarlo` (Monte Carlo / BER simulation utilities for
# testing this crate against itself on a host machine -- nothing an
# embedded target decoding real frames would call), and `ldpc_pipeline`'s
# threaded worker pool (needs `std::thread`;
# `transport_block::DlSchDecoder::with_pipeline` opts into it
# and is excluded along with it -- the sequential decode path stays
# available). Still allocates (`Vec`-based scratch, built once at
# construction on the hot-path types, exactly as the std build does) --
# this is not an allocation-free/bare-metal build; it targets a
# microcontroller with a working heap allocator (`#[global_allocator]`),
# which is the realistic embedded target for this crate's memory footprint
# (an f32 LDPC decode scratch buffer is hundreds of KiB at 5G's largest
# lifting size; the smallest QC-LDPC configurations are tens of KiB).
#
# Verified by cross-compiling the library for thumbv7em-none-eabihf, a real
# Cortex-M4F target, and -- via embedded-demo/, see that package's README --
# actually running the result under QEMU's netduinoplus2 machine model.
no_std = ["dep:libm"]

# Enables `serde_json` for the 3 src/bin/ exporters that emit JSON. Not
# needed by the library itself, and not needed by `bench/run_all.sh` (its two
# `cargo run` targets, bench_export/ldpc_bench_export, don't use JSON).
bench-export = ["dep:serde_json"]

# Explicit [[bin]] entries (Cargo auto-discovers src/bin/*.rs otherwise) only
# for the 3 exporters that need `serde_json`: `required-features` makes Cargo
# skip building/testing them unless `--features bench-export` is passed,
# instead of failing to compile every plain `cargo build --bins`/`cargo test`.
# The other 5 src/bin/ binaries stay auto-discovered.
[[bin]]
name = "ber_sim"
required-features = ["bench-export"]

[[bin]]
name = "ldpc_pipeline_bench"
required-features = ["bench-export"]

[[bin]]
name = "ldpc_convergence_export"
required-features = ["bench-export"]

[dev-dependencies]
proptest = "1.4"
once_cell = "1.20"
criterion = { version = "0.5", features = ["html_reports"] }
# Unconditional (not the optional `no_std`-gated one): `cargo test --features
# no_std` does not build -- test code throughout the crate uses Vec/Box
# implicitly via std's prelude and was never ported (no `#[cfg(test)]` code
# ships in the `no_std` build, so it never needed to be), so that is not a
# meaningful combination to run. This dev-dependency exists so
# `src/float_ext.rs`'s test can call `libm::` directly and check its output
# against `std`'s, in a plain `cargo test --all` run, without needing the
# `no_std` feature (or its 334 cascading test-code errors) at all.
libm = "0.2"

# loom is only ever compiled under `--cfg loom`, which nothing but the model
# check sets — so it is absent from an ordinary build, from `cargo test`, and
# from anything a downstream user resolves. It has to be a *normal* dependency
# rather than a dev-dependency because `src/sync_shim.rs` lives in the library
# itself: dev-dependencies are not visible to the lib target, only to tests.
[target.'cfg(loom)'.dependencies]
loom = "0.7"

[[bench]]
name = "fec_bench"
harness = false

# Lint policy. CI runs `cargo clippy --all-targets -- -D warnings`. Only two
# lints are allowed, each for a concrete reason; everything else is fixed in
# the source rather than suppressed.
[lints.rust]
# `--cfg loom` swaps `src/sync_shim.rs` onto loom's instrumented atomics and
# cells so `tests/loom_spsc.rs` can model-check the SPSC ring's memory
# ordering. It is set through RUSTFLAGS rather than declared as a Cargo
# feature, because loom must replace the primitives across the whole
# dependency graph and a feature only reaches this crate. Declaring it here is
# what keeps `unexpected_cfgs` accurate instead of blanket-allowing the lint.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[lints.clippy]
# Performance-intentional. CLAUDE.md mandates index-based, branch-free hot loops
# (SoA + SIMD friendliness) in the LDPC/RS/Viterbi kernels. Rewriting these into
# iterator form is exactly what that constraint forbids, so the lint is allowed.
needless_range_loop = "allow"

# The SIMD kernels in simd_avx2.rs take many flat pointer/length parameters by
# design; bundling them into a struct would add indirection on the hot path.
too_many_arguments = "allow"
