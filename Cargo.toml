[package]
name = "syndrome"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Multi-standard Forward Error Correction in safe Rust: 5G NR TS 38.212 (QC-LDPC LOMS), Wi-Fi 6/7, Reed-Solomon, Viterbi and Polar codes, with AVX2/NEON SIMD and lock-free pipelining."
authors = ["Thomas Glezer <thomas.glezer@hotmail.com>"]
readme = "README.md"
repository = "https://github.com/ThomasGl/syndrome"
keywords = ["fec", "ldpc", "5g", "reed-solomon", "simd"]
# "no-std" deliberately NOT claimed: the crate currently requires std (threads,
# Vec-based construction). Add the category if and when a real #![no_std] core
# build exists.
categories = ["algorithms", "encoding"]

# The published tarball is the library, its examples, and its tests. The
# development apparatus stays in the git repository.
#
# `src/bin/` matters most here: those six benchmark exporters are auto-discovered
# as binary targets, so publishing them would make `cargo install syndrome` drop
# `rs_bench`, `ber_sim`, `bench_export`, ... into the user's ~/.cargo/bin under
# names generic enough to collide with other crates. Only the `syndrome` demo
# binary (src/main.rs) should be installable. `bench/` goes with them because
# `bench/run_all.sh` drives those exporters — shipping one without the other
# would leave a harness that cannot run.
exclude = [
    "src/bin/",
    "bench/",
    "tools/",
    ".github/",
    "proptest-regressions/",
    "CLAUDE.md",
]

# rustdoc renders `$...$` in doc comments as literal text — it has no math
# support of its own. `katex-header.html` loads KaTeX so the LaTeX that CLAUDE.md
# mandates throughout the API docs actually typesets on docs.rs. To get the same
# locally: RUSTDOCFLAGS="--html-in-header katex-header.html" cargo doc --open
[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "katex-header.html"]
all-features = true

[dependencies]
core_affinity = { version = "0.6", optional = true }
serde_json = { version = "1.0", features = ["preserve_order"] }

[build-dependencies]
serde_json = "1.0"

[features]
# Enable thread-affinity helpers. This is the crate's only feature: it is the
# only one that gates real code (`#[cfg(feature = "affinity")]` in src/affinity.rs),
# and it exists because it pulls an optional dependency.
#
# There are deliberately NO `simd`/`simd_avx2`/`simd_neon` features. SIMD is not
# opt-in: the AVX2 kernels dispatch at runtime via `is_x86_feature_detected!` and
# the NEON kernels are gated on `#[cfg(target_arch = "aarch64")]`, so both are
# always available wherever the hardware supports them. Earlier versions declared
# those flags plus `simd_avx512` and `cortex-m`; none of them gated a single line
# of code, so enabling them did nothing while implying a choice that did not exist.
# Removing a feature is a breaking change once published, so they are gone before
# 0.1.0 rather than after. If a genuine compile-time SIMD or `#![no_std]` switch is
# added later, introducing a feature for it is backward-compatible.
affinity = ["core_affinity"]

[dev-dependencies]
proptest = "1.4"
once_cell = "1.20"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "fec_bench"
harness = false

# Lint policy. CI runs `cargo clippy --all-targets -- -D warnings`. Only three
# clippy lints are allowed, each for a concrete reason; everything else is fixed
# in the source rather than suppressed. (One rustc lint is also allowed, scoped
# to three functions in src/turbo.rs — see the comment there; it resolves a
# conflict between our MSRV and current stable that no single spelling satisfies.)
[lints.clippy]
# Performance-intentional. CLAUDE.md mandates index-based, branch-free hot loops
# (SoA + SIMD friendliness) in the LDPC/RS/Viterbi kernels. Rewriting these into
# iterator form is exactly what that constraint forbids, so the lint is allowed.
needless_range_loop = "allow"

# The SIMD kernels in simd_avx2.rs take many flat pointer/length parameters by
# design; bundling them into a struct would add indirection on the hot path.
too_many_arguments = "allow"

# `<integer>::is_multiple_of` was stabilized in Rust 1.87, but our MSRV is 1.85
# (see rust-version in [package]). The manual `% n == 0` form is required to
# build on the declared minimum toolchain.
manual_is_multiple_of = "allow"
