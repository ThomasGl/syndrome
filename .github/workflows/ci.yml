name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build (release)
        run: cargo build --release

      - name: Run unit + integration tests
        run: cargo test --all

      - name: Run doctests
        run: cargo test --doc

  test-arm:
    name: Test Suite (AArch64 / NEON)
    # GitHub's free arm64 runners for public repos: the full suite executes
    # natively on ARM, so the NEON kernels are run, not just compiled.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arm-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arm-cargo-

      - name: Run unit + integration tests (native NEON)
        run: cargo test --all

      - name: Clippy (zero warnings on AArch64)
        run: cargo clippy --all-targets -- -D warnings

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      # NOT --all-features: `no_std` and `--all-targets` (tests) do not mix
      # (test code throughout the crate uses Vec/Box implicitly via std's
      # prelude and was never ported -- no `#[cfg(test)]` code ships in the
      # `no_std` build, so it never needed to be). `affinity`+`bench-export`
      # are the two features real Rust callers can combine with tests.
      - name: Run Clippy with std-compatible features enabled
        run: cargo clippy --all-targets --features affinity,bench-export -- -D warnings

      # `no_std`'s own check (lib only, matches what it can actually build)
      # lives in the `no-std` job below, cross-compiled to a real embedded
      # target rather than just checked on the runner's host triple.

  # Every feature flag must build on its own. Enabling only the umbrella
  # `simd` feature once silently pulled in a nightly-only `portable_simd`
  # path that no default-feature job ever compiled, so the advertised
  # feature was broken on stable without CI noticing. Check each in turn.
  # `no_std` is deliberately NOT in this matrix: unlike the others it changes
  # `--all-targets` results (tests don't build under it -- see the `no-std`
  # job below, which checks what it actually promises: the library only,
  # cross-compiled to a real embedded target).
  features:
    name: Feature Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature:
          - affinity
          - bench-export
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Check --features ${{ matrix.feature }}
        run: cargo check --all-targets --features ${{ matrix.feature }}

      - name: Check --no-default-features
        run: cargo check --no-default-features

      # NOT --all-features (see `no_std`'s comment above this matrix).
      - name: Check --all-targets with every std-compatible feature enabled
        run: cargo check --all-targets --features affinity,bench-export

  # #![no_std]+alloc build of the core algorithms (see the `no_std` feature's
  # doc comment in Cargo.toml for exact scope). Cross-compiled to a real
  # Cortex-M4F target rather than merely checked on the runner's host triple
  # -- `is_x86_feature_detected!`/`std::arch` mistakes and similar would not
  # show up checking against a std-having host at all, since those symbols
  # would just resolve normally there.
  no-std:
    name: no_std (thumbv7em-none-eabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain with clippy, thumbv7em target
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: thumbv7em-none-eabihf

      - name: Check --lib
        run: cargo check --no-default-features --features no_std --target thumbv7em-none-eabihf --lib

      - name: Clippy --lib
        run: cargo clippy --no-default-features --features no_std --target thumbv7em-none-eabihf --lib -- -D warnings

      # Also check the native host triple: thumbv7em never compiles
      # simd_avx2.rs (target_arch != "x86_64") at all, so it alone can't
      # catch a `std::arch`/`is_x86_feature_detected!` mistake there.
      - name: Check --lib on host (exercises the x86-64 SIMD path too)
        run: cargo check --no-default-features --features no_std --lib

      # `libm`'s output is checked against `std`'s directly in
      # src/float_ext.rs's test, as a plain `cargo test` (not requiring the
      # `no_std` feature at all -- see that test's doc comment for why).

  # capi/ is a standalone package (own Cargo.toml/Cargo.lock, `path = ".."`
  # dependency on the parent crate, not a workspace member -- see
  # capi/src/lib.rs's module doc for why it cannot be a feature of the
  # parent crate itself), so a plain `cargo test`/`clippy` run at the repo
  # root never touches it. It needs its own job.
  capi:
    name: capi (C ABI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Test (Rust-side FFI tests)
        working-directory: capi
        run: cargo test

      - name: Clippy
        working-directory: capi
        run: cargo clippy --all-targets -- -D warnings

      - name: Build the real .so/.a
        working-directory: capi
        run: cargo build --release

      # The strongest check this job does: an actual C program, compiled
      # and linked against the built shared library by a real C compiler,
      # not just Rust-side FFI tests exercising the same functions from
      # inside the same binary.
      - name: Compile and link a real C program against libsyndrome_capi.so
        run: |
          cat > /tmp/capi_check.c <<'EOF'
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          typedef struct SyndromeLdpcEncoder SyndromeLdpcEncoder;
          typedef struct SyndromeLdpcDecoder SyndromeLdpcDecoder;
          extern int32_t syndrome_ldpc_encoder_create(int32_t, size_t, SyndromeLdpcEncoder **);
          extern void syndrome_ldpc_encoder_destroy(SyndromeLdpcEncoder *);
          extern size_t syndrome_ldpc_encoder_info_bit_count(const SyndromeLdpcEncoder *);
          extern size_t syndrome_ldpc_encoder_codeword_bit_count(const SyndromeLdpcEncoder *);
          extern int32_t syndrome_ldpc_encode_5g(const SyndromeLdpcEncoder *, const uint8_t *, size_t, size_t, uint8_t *, size_t);
          extern int32_t syndrome_ldpc_decoder_create(int32_t, size_t, float, SyndromeLdpcDecoder **);
          extern void syndrome_ldpc_decoder_destroy(SyndromeLdpcDecoder *);
          extern size_t syndrome_ldpc_decoder_required_edge_buffer(const SyndromeLdpcDecoder *);
          extern size_t syndrome_ldpc_decoder_required_layer_buffer(const SyndromeLdpcDecoder *);
          extern int32_t syndrome_ldpc_decode_5g(SyndromeLdpcDecoder *, float *, size_t, size_t, float *, size_t, float *, size_t, uint8_t *, size_t, size_t, size_t *);
          int main(void) {
            SyndromeLdpcEncoder *enc = NULL;
            if (syndrome_ldpc_encoder_create(0, 4, &enc) != 0 || !enc) return 1;
            SyndromeLdpcDecoder *dec = NULL;
            if (syndrome_ldpc_decoder_create(0, 4, 0.5f, &dec) != 0 || !dec) return 1;
            size_t k = syndrome_ldpc_encoder_info_bit_count(enc);
            size_t n = syndrome_ldpc_encoder_codeword_bit_count(enc);
            uint8_t *info = malloc(k), *codeword = malloc(n), *hard = malloc(n);
            for (size_t i = 0; i < k; i++) info[i] = (i % 3 == 0);
            if (syndrome_ldpc_encode_5g(enc, info, k, 0, codeword, n) != 0) return 1;
            float *llr = malloc(n * sizeof(float));
            for (size_t i = 0; i < n; i++) llr[i] = codeword[i] ? -5.0f : 5.0f;
            size_t el = syndrome_ldpc_decoder_required_edge_buffer(dec);
            size_t ll = syndrome_ldpc_decoder_required_layer_buffer(dec);
            float *edge_r = calloc(el, sizeof(float)), *layer = calloc(ll, sizeof(float));
            size_t iters = 0;
            if (syndrome_ldpc_decode_5g(dec, llr, n, 0, edge_r, el, layer, ll, hard, n, 10, &iters) != 0) return 1;
            for (size_t i = 0; i < k; i++) if (hard[i] != info[i]) { fprintf(stderr, "mismatch at %zu\n", i); return 1; }
            printf("capi C round trip OK: k=%zu n=%zu iters=%zu\n", k, n, iters);
            syndrome_ldpc_encoder_destroy(enc);
            syndrome_ldpc_decoder_destroy(dec);
            return 0;
          }
          EOF
          cc /tmp/capi_check.c -o /tmp/capi_check \
            -L capi/target/release -lsyndrome_capi \
            -Wl,-rpath,"$GITHUB_WORKSPACE/capi/target/release"
          /tmp/capi_check

  # embedded-demo/ is likewise a standalone package (see its README for
  # why), and is not merely checked here -- it is actually cross-compiled
  # AND run under QEMU, so a change that silently breaks execution (like
  # the undersized heap the first version of this demo shipped with) fails
  # this job instead of only ever being caught by whoever happens to run it
  # by hand.
  embedded-demo:
    name: embedded-demo (Cortex-M4F, run under QEMU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain, thumbv7em target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf

      - name: Install qemu-system-arm
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm

      - name: Build the firmware
        working-directory: embedded-demo
        run: cargo build --release

      - name: Run under QEMU and check for a real PASS
        working-directory: embedded-demo
        run: |
          set -o pipefail
          timeout 30 qemu-system-arm \
            -M netduinoplus2 \
            -semihosting-config enable=on,target=native \
            -nographic \
            -kernel target/thumbv7em-none-eabihf/release/syndrome-embedded-demo \
            | tee /tmp/qemu-output.log
          grep -q "RESULT: PASS" /tmp/qemu-output.log

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  msrv:
    name: MSRV (1.97)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.97 (declared MSRV)
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msrv-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-msrv-

      # Build the library and binaries only; dev-dependencies (criterion,
      # proptest, ...) may track a newer toolchain and are not part of the
      # public MSRV contract.
      #
      # `+1.97.0` is load-bearing. rust-toolchain.toml pins `channel = "stable"`,
      # and a toolchain file outranks the `rustup default` that the setup action
      # sets — so a bare `cargo build` here silently compiled with stable and
      # this job proved nothing about the declared MSRV. An explicit `+toolchain`
      # is the only override with higher precedence than the file.
      # The MSRV contract is "builds cleanly", not merely "compiles", so the
      # build output is failed on any warning rather than only on a nonzero exit.
      - name: Build on MSRV
        run: |
          set -o pipefail
          cargo +1.97.0 build --release 2>&1 | tee msrv-build.log
          if grep -q '^warning' msrv-build.log; then
            echo "::error::MSRV build emitted warnings (see log above)"
            exit 1
          fi

  loom:
    name: Loom (SPSC memory ordering)
    runs-on: ubuntu-latest
    # The SPSC ring's Acquire/Release pairing is a claim the ordinary stress
    # tests cannot check: this runner is x86-64, which will not reorder a
    # store past a store, so a queue with a genuinely wrong ordering passes
    # them indefinitely here while failing on AArch64. loom model-checks the
    # ring against the C11 ordering rules instead, exploring the
    # interleavings exhaustively rather than sampling whatever the hardware
    # happens to produce.
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-loom-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-loom-

      # --release matters: loom re-executes the model body once per
      # interleaving, and a debug build makes that slow enough to be
      # unpleasant for no extra coverage.
      - name: Model-check the SPSC ring
        run: RUSTFLAGS="--cfg loom" cargo test --release --test loom_spsc

  miri:
    name: Miri (non-SIMD unsafe)
    runs-on: ubuntu-latest
    # Miri interprets Rust at the level of its aliasing and memory model, so it
    # sees the things a test suite cannot: a raw pointer outliving its
    # allocation, a `&mut` overlapping a `&`, an out-of-bounds slot index that
    # happens to land inside another live object.
    #
    # Scope is deliberate. Every remaining `unsafe` in the crate is a call into
    # `simd_avx2`/`simd_neon`, and Miri cannot execute those intrinsics — so
    # the module list below is not a sample of the unsafe code, it *is* the
    # non-SIMD unsafe code: the SPSC ring's cells and the LDPC pipeline's
    # frame-pool protocol. The SIMD kernels are held to a different standard
    # instead, being proven equal to a retained scalar reference.
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-miri-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-miri-

      # The cross-thread stress tests scale themselves down under `cfg(miri)`
      # (see `STRESS_COUNT` in src/spsc_queue.rs); Miri costs about a thousand
      # times native speed, and what it checks is structural rather than
      # statistical.
      - name: Miri — SPSC ring
        run: cargo +nightly miri test --lib spsc_queue

      - name: Miri — LDPC pipeline frame pool
        run: cargo +nightly miri test --lib ldpc_pipeline

  doc-math:
    name: Rustdoc Math
    runs-on: ubuntu-latest
    # rustdoc renders doc comments as CommonMark *before* KaTeX sees them, and
    # CommonMark strips a backslash that precedes ASCII punctuation. The result
    # is a class of bug that cannot be caught by reading the generated pages:
    # `katex-header.html` sets `throwOnError: false`, so a malformed expression
    # renders as red raw source rather than failing the build, and a row break
    # that lost a backslash renders cleanly with every row collapsed into one.
    # This job re-runs the pipeline and parses each span, so the convention
    # documented in katex-header.html is enforced instead of remembered.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install KaTeX
        working-directory: tools
        run: npm ci

      - name: Check every math span in the rustdoc comments
        working-directory: tools
        run: npm run check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo-audit (RustSec advisory scan)
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  fuzz-smoke:
    name: Fuzz Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly Rust toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-fuzz-${{ hashFiles('fuzz/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # Build every target, then run each for a few seconds so the harness
      # actually executes — a build-only check would miss instrumentation
      # regressions. This is a smoke test, not an exhaustive campaign: the
      # goal is to catch a target that stopped compiling or panics on the
      # empty/seed corpus, not to find deep bugs (that needs a long run).
      - name: Build fuzz targets
        working-directory: fuzz
        run: cargo +nightly fuzz build

      - name: Smoke-run each fuzz target (10s)
        working-directory: fuzz
        run: |
          for target in $(cargo +nightly fuzz list); do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" -- -max_total_time=10 -runs=100000
            echo "::endgroup::"
          done
