<!-- KaTeX for rustdoc math. Rationale and the SRI-recompute command are in
     Cargo.toml under [package.metadata.docs.rs]; this file is copied verbatim
     into the <head> of every generated page, so it is kept short.

     WRITING MATH IN DOC COMMENTS -- one rule, and it is counter-intuitive.
     rustdoc runs the comment through CommonMark BEFORE KaTeX sees it, and
     CommonMark drops a backslash that precedes ASCII punctuation. So a LaTeX
     command whose next character is punctuation arrives mutilated, while one
     followed by a letter arrives intact:

         \,  \;  \!  ->  , ; !          (literal punctuation, not spacing)
         \{  \}       ->  { }            (grouping; the braces vanish)
         \\           ->  \              (row break lost)
         \&            ->  &              (alignment char -> KaTeX error)
         \_ in \text{} ->  _              (KaTeX error: `_` in text mode)

     Therefore, in `///` and `//!` comments:
       * prefer letter-only macros -- \thinspace \thickspace \negthinspace
         \lbrace \rbrace -- which pass through untouched;
       * where none exists, double the backslash so one survives: `\\&`, and
         `\\_` inside \text{} / \mathrm{};
       * write a row break as `\\\\` (four), which reaches KaTeX as `\\`;
       * a bare `\_` OUTSIDE \text{} is correct for a subscript -- markdown
         turns it into `_`, which is what you wanted.

     This applies to rustdoc ONLY. README.md, CHANGELOG.md and
     system_architecture.md use NO LaTeX at all -- plain text / Unicode
     (beta, x, subscripts written Eb/N0, standalone equations as a ```text
     fenced block) -- because crates.io renders the README as a bare HTML
     fragment with no script or stylesheet injection possible, so $...$
     syntax can never render there: it shows up as literal backslashes and
     braces on the crate's own crates.io page, to every visitor, regardless
     of escaping convention. Verified by fetching
     https://static.crates.io/readmes/<crate>/<crate>-<version>.html, which
     contains zero <script>/<link> tags. Do not copy the rustdoc convention
     into those three files, or LaTeX into them at all.

     To check, run the harness rather than eyeballing the rendered pages:

         cd tools && npm ci && npm run check

     `tools/check_doc_math.mjs` extracts every math span from the crate's
     doc comments, applies CommonMark's escape rule, and parses the result
     with KaTeX. `tests/doc_math.rs` runs the same check from `cargo test`:
     its structural rules need no dependencies and always run, and it invokes
     the KaTeX parse above as well whenever the npm package is installed. Eyeballing does not work, for two reasons: `throwOnError:
     false` below means a malformed expression shows up as red raw source on
     the page instead of failing loudly, and a row break that lost a
     backslash renders cleanly with every row collapsed into one. The CI job
     `doc-math` runs the same check on every push. -->
<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.css"
  integrity="sha384-1vdNCNel6Tx/NQa8IR1mGOGKsbGreCkOPfbtPPnUURJ5Tu2PRVfQ/7KLZC+Pi1p1"
  crossorigin="anonymous">

<script
  defer
  src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/katex.min.js"
  integrity="sha384-ycJ6GAwiS15LoUPipwJOrWTvkUHl/YqELValBwI5I4awP1EeEQJYarj+w85ntcz7"
  crossorigin="anonymous"></script>

<script
  defer
  src="https://cdn.jsdelivr.net/npm/katex@0.18.1/dist/contrib/auto-render.min.js"
  integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz"
  crossorigin="anonymous"></script>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    renderMathInElement(document.body, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "$", right: "$", display: false },
      ],
      // Do not abort the whole page because one expression is malformed.
      throwOnError: false,
    });
  });
</script>
